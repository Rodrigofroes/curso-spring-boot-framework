spring:
  application:
    name: aprenda-spring-boot-framework
  datasource:
    driver-class-name: org.mariadb.jdbc.Driver
    url: jdbc:mariadb://localhost:3306/aprenda_spring_boot_framework?useTimezone=true&serverTimezone=UTC
    username: root
    password: 1234
  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate.dialect: org.hibernate.dialect.MariaDBDialect
    show-sql: false
    open-in-view: false
logging:
  level:
    root: WARN
    br.com.rodrigofroes: DEBUG